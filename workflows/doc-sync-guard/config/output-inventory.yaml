  # -----------------------------------------------------------------------
  # Out of scope: not this project's content, so no documentation answer.
  # Visible to seed_paths() only.
  # -----------------------------------------------------------------------
  - path: "__pycache__/"
    assertion: out-of-scope
    reason: interpreter bytecode cache
    seed: false
    provenance: ["sweep-1"]

  - path: "*.py[cod]"
    assertion: out-of-scope
    reason: interpreter bytecode files
    seed: false
    provenance: ["sweep-1"]

  - path: "*.egg-info/"
    assertion: out-of-scope
    reason: package metadata
    seed: false
    provenance: ["sweep-1"]

  - path: "dist/"
    assertion: out-of-scope
    reason: packaging output
    seed: false
    provenance: ["sweep-1"]

  - path: "build/"
    assertion: out-of-scope
    reason: packaging build tree
    seed: false
    provenance: ["sweep-1"]

  - path: ".venv/"
    assertion: out-of-scope
    reason: project setup deliberately creates it, but it holds third-party package content
    seed: true
    provenance: ["sweep-1"]

  - path: "venv/"
