# Doc-sync-guard classified output inventory
#
# One row per non-comment .gitignore line, plus the guard output destinations
# named before they exist. Read only through
# workflows/doc-sync-guard/scripts/inventory.py - nothing else parses this file.
#
# Row fields:
#   path        the .gitignore line, or a concrete path. Always quoted: an
#               unquoted scalar beginning with * is a YAML alias.
#   assertion   assert-ignored | assert-tracked | out-of-scope
#   example     a path the pattern must match, present only on a patterned
#               assertion row. A concrete row has no example key at all.
#   seed        whether the path seeds the unregistered-output check.
#   doc_sync    the documentation answer for the path, on assertion rows only:
#               E10 | E11 | E12 | E13 | checked | not-policed.
#   reason      why the path is out of scope, on out-of-scope rows only.
#   provenance  which derivation named the row: sweep-1 (every non-comment
#               .gitignore line), sweep-2 (write-mode operations across every
#               scripts/ directory), sweep-3 (every workflow CONTEXT.md Outputs
#               section), or decision-13a (named by the plan; no sweep could
#               have found it, because the path does not exist yet).
#
# Signature exclusion is not stored here. It is derived by the loader from the
# assertion, the doc-sync answer, and the basename.
#
# Examples below a personal container (wikis/, conversations/, journal/entries/,
# reviews/, user-inputs/, memory/) are synthetic. Never write a real item name
# into this file: it is committed, and a real name here is the leak the
# personal-data guard exists to stop.

version: 1

rows:

  # -----------------------------------------------------------------------
  # Assert ignored: paths that must be ignored before anything writes them.
  # -----------------------------------------------------------------------
  - path: ".env"
    assertion: assert-ignored
    seed: false
    doc_sync: not-policed
    provenance: ["sweep-1"]

  - path: "**/LOG.md"
    assertion: assert-ignored
    example: "workflows/audit/LOG.md"
    seed: true
    doc_sync: checked
    provenance: ["sweep-1", "sweep-2"]

