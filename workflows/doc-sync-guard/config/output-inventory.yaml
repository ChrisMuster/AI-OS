  # -----------------------------------------------------------------------
  # Guard output destinations named before they exist. No sweep could have
  # found these, so their provenance is the decision that named them.
  # -----------------------------------------------------------------------
  - path: "workflows/doc-sync-guard/certification/*"
    assertion: assert-ignored
    example: "workflows/doc-sync-guard/certification/example-certification.json"
    seed: true
    doc_sync: E10
    provenance: ["decision-13a"]

  # Patterned, not concrete, and deliberately so. The name is synthetic (the
  # real one is <run-id>-certification.md), and seed_paths() returns row paths
  # rather than examples, so a concrete row here would hand the unregistered-
  # output check a destination no writer will ever write. As a pattern the
  # synthetic name stays in `example`, which no seed view reads, and the row
  # still asserts that a .md report shape is ignored. Same shape as the .json
  # row above.
  - path: "workflows/doc-sync-guard/certification/*.md"
    assertion: assert-ignored
    example: "workflows/doc-sync-guard/certification/example-certification.md"
    seed: true
    doc_sync: E10
    provenance: ["decision-13a"]

  - path: "workflows/doc-sync-guard/certification/acceptances.jsonl"
    assertion: assert-ignored
