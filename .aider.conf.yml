# Book Dragon — Aider configuration
#
# Aider does not auto-load AGENTS.md. The read list below ensures
# the project's universal rules are loaded at the start of every session.
# See AGENT-SETUP.md for full setup instructions.

read:
  - AGENTS.md

# MCP servers — biblio-tools exposes project scripts as typed tools.
# Requires Python 3.10+ and the mcp package (pip install -r workflows/biblio-tools/requirements.txt).
mcp-server:
  - name: biblio-tools
    command: python
    args:
      - workflows/biblio-tools/scripts/server.py
